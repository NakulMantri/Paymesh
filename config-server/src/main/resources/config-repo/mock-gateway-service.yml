server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymesh_gateway_db}
    username: ${DB_USER:paymesh_user}
    password: ${DB_PASSWORD:paymesh_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

gateway:
  simulation:
    default-failure-rate-percent: 0
    default-delay-ms: 100
