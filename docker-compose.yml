version: '3.8'

services:
  # =================================================================
  # INFRASTRUCTURE SERVICES
  # =================================================================

  postgres:
    image: postgres:16-alpine
    container_name: paymesh-postgres
    environment:
      POSTGRES_USER: paymesh_user
      POSTGRES_PASSWORD: paymesh_pass
      POSTGRES_MULTIPLE_DATABASES: paymesh_user_db,paymesh_wallet_db,paymesh_biller_db,paymesh_gateway_db,paymesh_payment_db,paymesh_notification_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymesh_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paymesh-network

  redis:
    image: redis:7-alpine
    container_name: paymesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - paymesh-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: paymesh-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paymesh-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: paymesh-zipkin
    ports:
      - "9411:9411"
    networks:
      - paymesh-network

  prometheus:
    image: prom/prometheus:latest
    container_name: paymesh-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - paymesh-network

  grafana:
    image: grafana/grafana:latest
    container_name: paymesh-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - paymesh-network

  # =================================================================
  # SPRING CLOUD INFRASTRUCTURE
  # =================================================================

  config-server:
    build:
      context: ./config-server
    container_name: paymesh-config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_HOST=discovery-server
    networks:
      - paymesh-network

  discovery-server:
    build:
      context: ./discovery-server
    container_name: paymesh-discovery-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    networks:
      - paymesh-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: paymesh-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      - discovery-server
      - config-server
    networks:
      - paymesh-network

  # =================================================================
  # CORE DOMAIN MICROSERVICES
  # =================================================================

  user-service:
    build:
      context: ./user-service
    container_name: paymesh-user-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_user_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

  wallet-service:
    build:
      context: ./wallet-service
    container_name: paymesh-wallet-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_wallet_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - REDIS_HOST=redis
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

  biller-service:
    build:
      context: ./biller-service
    container_name: paymesh-biller-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_biller_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

  mock-gateway-service:
    build:
      context: ./mock-gateway-service
    container_name: paymesh-mock-gateway
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_gateway_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

  payment-service:
    build:
      context: ./payment-service
    container_name: paymesh-payment-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_payment_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

  notification-service:
    build:
      context: ./notification-service
    container_name: paymesh-notification-service
    ports:
      - "8086:8086"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=paymesh_notification_db
      - DB_USER=paymesh_user
      - DB_PASSWORD=paymesh_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_HOST=discovery-server
      - CONFIG_SERVER_URL=http://config-server:8888
      - ZIPKIN_HOST=zipkin
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - paymesh-network

networks:
  paymesh-network:
    driver: bridge

volumes:
  postgres_data:
