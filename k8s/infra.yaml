apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: paymesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: paymesh_user
            - name: POSTGRES_PASSWORD
              value: paymesh_pass
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "paymesh_user_db,paymesh_wallet_db,paymesh_biller_db,paymesh_gateway_db,paymesh_payment_db,paymesh_notification_db"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paymesh
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
